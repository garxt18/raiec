spring.application.name=raiec

# ---- PostgreSQL (local) ----
# Create the database first in pgAdmin:  CREATE DATABASE raiec;
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/raiec}
spring.datasource.username=${DB_USER:postgres}
# Do NOT commit a real password. Set env var DB_PASSWORD, or edit the fallback below for local dev only.
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# 'update' lets our entities create/evolve tables during development.
# We will switch to 'validate' + Flyway migrations before any real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# ---- File upload (tender PDFs) ----
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ===== Auth / JWT =====
# Override the secret in any real deployment via the RAIEC_JWT_SECRET env var (min 32 chars for HS256).
raiec.jwt.secret=${RAIEC_JWT_SECRET:raiec-dev-secret-change-me-please-0123456789-abcdefghijklmnop}
raiec.jwt.expiration-ms=28800000


# ===== AI assessment (LLM, optional) =====
# Leave api-key empty to use the built-in rule-based assessment.
# To enable a real LLM, set RAIEC_LLM_API_KEY (and optionally base-url/model) for any
# OpenAI-compatible provider (OpenAI, Groq, OpenRouter, Together, ...).
raiec.llm.enabled=true
raiec.llm.api-key=${RAIEC_LLM_API_KEY:}
raiec.llm.base-url=${RAIEC_LLM_BASE_URL:https://api.openai.com/v1}
raiec.llm.model=${RAIEC_LLM_MODEL:gpt-4o-mini}
raiec.llm.temperature=0.3
raiec.llm.max-tokens=400
raiec.llm.timeout-ms=20000

# ===== CORS =====
# Comma-separated origins allowed to call the API. '*' is fine locally; set this to the real
# frontend domain in any deployment, e.g. RAIEC_CORS_ORIGINS=https://raiec.vercel.app
raiec.cors.allowed-origins=${RAIEC_CORS_ORIGINS:*}
